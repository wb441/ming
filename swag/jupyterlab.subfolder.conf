# JupyterLab subfolder configuration
# Access JupyterLab at yourdomain.com/jupyterlab/

location /jupyterlab {
    return 301 $scheme://$host/jupyterlab/;
}

location ^~ /jupyterlab/ {
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app jupyterlab;
    set $upstream_port 8888;
    set $upstream_proto http;
    proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    
    # JupyterLab base URL
    proxy_set_header X-Forwarded-Context /jupyterlab;
}
