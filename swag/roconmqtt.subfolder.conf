# Rotex RoconMqtt subfolder configuration
# Access RoconMqtt health/status at yourdomain.com/rocon/

location /rocon {
    return 301 $scheme://$host/rocon/;
}

location ^~ /rocon/ {
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app roconmqtt;
    set $upstream_port 5000;
    set $upstream_proto http;
    proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    
    rewrite /rocon(.*) $1 break;
}
