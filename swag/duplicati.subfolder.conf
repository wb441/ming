# Duplicati subfolder configuration
# Access Duplicati at yourdomain.com/duplicati/

location /duplicati {
    return 301 $scheme://$host/duplicati/;
}

location ^~ /duplicati/ {
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app duplicati;
    set $upstream_port 8200;
    set $upstream_proto http;
    
    rewrite ^/duplicati/(.*) /$1 break;
    proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    
    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    proxy_redirect / /duplicati/;
    proxy_redirect ~^/(.*)$ /duplicati/$1;
}
