version: '2'
volumes:
    influxdb-data:
    nodered-data:
    grafana-data:
    jupyterlab-data:
    homeassistant-data:
    rhasspy-data:
    swag-data:
    duplicati-data:
    redis-data:
    matter-server-data:
    duckdns-data:
    samba-data:
services:
  nodered:
    restart: always
    build: ./nodered
    volumes:
      - 'nodered-data:/data'
    ports:
      - "1880:1880"
  influxdb:
    restart: always
    build: ./influxdb
    environment:
      - INFLUXDB_DB=ming_default
    volumes:
      - 'influxdb-data:/var/lib/influxdb'
    ports:
      - "8086:8086"
  grafana:
    restart: always
    build: ./grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "3000:3000"
    volumes:
      - 'grafana-data:/var/lib/grafana'
    depends_on:
      - influxdb
  mosquitto:
    restart: always
    build: ./mosquitto
    ports:
      - "1883:1883"
      - "1884:1884"
  jupyterlab:
    restart: always
    build: ./jupyterlab
    ports:
      - "8888:8888"
    volumes:
      - 'jupyterlab-data:/data'
  homeassistant:
    restart: always
    build: ./homeassistant
    ports:
      - "8123:8123" 
    volumes:
      - 'homeassistant-data:/config'
  swag:
    restart: always
    build: ./swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - URL=yourdomain.com
      - VALIDATION=http
      - ONLY_SUBDOMAINS=false
      - STAGING=false # Set to true for testing SSL certificates
    volumes:
      - 'swag-data:/config'
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - homeassistant
      - duplicati
  duplicati:
    restart: always
    build: ./duplicati
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - CLI_ARGS=--webservice-interface=any --webservice-port=8200
    volumes:
      - 'duplicati-data:/config'
      - 'nodered-data:/source/nodered:ro'
      - 'influxdb-data:/source/influxdb:ro'
      - 'grafana-data:/source/grafana:ro'
      - 'homeassistant-data:/source/homeassistant:ro'
      - 'jupyterlab-data:/source/jupyterlab:ro'
    ports:
      - "8200:8200"
  setup-can:
    image: alpine:latest
    network_mode: host
    privileged: true
    restart: "no"
    command: >
      sh -c "
      apk add --no-cache iproute2 can-utils;
      echo 'Setting up CAN interface...';
      if ! ip link show can0 > /dev/null 2>&1; then
        echo 'WARNING: can0 interface not found. Ensure the MCP2515 device tree overlay is loaded via Balena config.';
        echo 'Set BALENA_HOST_CONFIG_dtoverlay=mcp2515-can0,oscillator=16000000,interrupt=25';
        exit 0;
      fi;
      if ip -d link show can0 | grep -q 'bitrate 20000'; then
        echo 'CAN interface can0 already configured with bitrate 20000';
        ip link set can0 up 2>/dev/null || true;
        echo 'CAN interface can0 is up';
        exit 0;
      fi;
      ip link set dev can0 down 2>/dev/null || true;
      sleep 1;
      ip link set dev can0 type can bitrate 20000;
      ip link set dev can0 up;
      echo 'CAN interface can0 is up with bitrate 20000';
      "
  roconmqtt:
    restart: always
    build: ./rotex-rocon2mqtt
    network_mode: host
    depends_on:
      - setup-can
      - mosquitto
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kestrel__Endpoints__Http__Url=http://0.0.0.0:5000
      - Can__MachineType=EHSHXXPXXA
      - Can__CanInterfaceName=can0
      - Can__TimeZoneId=Europe/Brussels
      - Mqtt__Enabled=true
      - Mqtt__Host=mosquitto
      - Mqtt__Port=1883
      - Mqtt__UseTls=false
      - Mqtt__ClientId=rocon-mqtt
      - Mqtt__Username=
      - Mqtt__Password=
      - Mqtt__KeepAlivePeriodSeconds=30
      - Mqtt__Topic=rocon
      - Mqtt__ChangeThresholdPercent=2.0
      - Mqtt__TimeZoneId=Europe/Brussels
      - Mqtt__PollingIntervalSeconds=30
      - Mqtt__ResponseTimeoutSeconds=5
      - Mqtt__HomeAssistant__Discovery=true
      - Mqtt__HomeAssistant__DiscoveryPrefix=homeassistant
    ports:
      - "5000:5000"
  duckdns:
    restart: always
    build: ./duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SUBDOMAINS=yourdomain
      - TOKEN=your-duckdns-token
    volumes:
      - 'duckdns-data:/config'
  matter-server:
    restart: always
    build: ./matter-server
    network_mode: host
    volumes:
      - 'matter-server-data:/data'
  redis:
    restart: always
    build: ./redis
    volumes:
      - 'redis-data:/data'
    ports:
      - "6379:6379"
  samba:
    restart: always
    build: ./samba
    environment:
      - USERID=1000
      - GROUPID=1000
      - TZ=UTC
      # Usage: -u "username;password" -s "sharename;path;browsable;readonly;guest;users;admins;writelist;comment"
      - USER=balena;balena
      - SHARE=nodered;/shares/nodered;yes;no;no;balena;balena
      - SHARE2=influxdb;/shares/influxdb;yes;no;no;balena;balena
      - SHARE3=grafana;/shares/grafana;yes;no;no;balena;balena
      - SHARE4=homeassistant;/shares/homeassistant;yes;no;no;balena;balena
      - SHARE5=jupyterlab;/shares/jupyterlab;yes;no;no;balena;balena
      - SHARE6=swag;/shares/swag;yes;no;no;balena;balena
      - SHARE7=duplicati;/shares/duplicati;yes;no;no;balena;balena
      - SHARE8=redis;/shares/redis;yes;no;no;balena;balena
      - SHARE9=duckdns;/shares/duckdns;yes;no;no;balena;balena
      - SHARE10=matter-server;/shares/matter-server;yes;no;no;balena;balena
    volumes:
      - 'nodered-data:/shares/nodered'
      - 'influxdb-data:/shares/influxdb'
      - 'grafana-data:/shares/grafana'
      - 'homeassistant-data:/shares/homeassistant'
      - 'jupyterlab-data:/shares/jupyterlab'
      - 'swag-data:/shares/swag'
      - 'duplicati-data:/shares/duplicati'
      - 'redis-data:/shares/redis'
      - 'duckdns-data:/shares/duckdns'
      - 'matter-server-data:/shares/matter-server'
      - 'samba-data:/config'
    ports:
      - "139:139"
      - "445:445"
